# flutter_launcher_icons 配置。源图由 `flutter test tool/icon_gen_test.dart` 生成。
flutter_launcher_icons:
  image_path: 'assets/icon/icon.png'
  android: true
  # 与 flutter create 默认 minSdk 一致。
  min_sdk_android: 23
  adaptive_icon_background: '#3F6EDC'
  adaptive_icon_foreground: 'assets/icon/icon_foreground.png'
  ios: true
  remove_alpha_ios: true
